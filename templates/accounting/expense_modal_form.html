<div class="modal-dialog modal-dialog-centered rv-expense-modal-dialog" role="document">
    <div class="modal-content rv-modal rv-finance-modal rv-expense-modal">
        <form id="new-expense-form" method="POST" class="rv-expense-modal-form">
            {% csrf_token %}
            <div class="modal-header">
                <div class="rv-prog-modal-header-content">
                    <div class="rv-prog-modal-icon rv-expense-modal-icon" id="movement-modal-icon" aria-hidden="true">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    <div>
                        <h5 class="modal-title" id="movement-modal-title">Registrar movimiento</h5>
                        <p class="rv-modal-subtitle mb-0">
                            {% if cash_obj %}{{ cash_obj.name }} · {{ subsidiary_obj.name|default:"Sede" }}{% else %}Movimiento de caja{% endif %}
                        </p>
                    </div>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <div class="rv-expense-modal-layout">
                    <section class="rv-expense-modal-section">
                        <h6 class="rv-expense-modal-section-title">Tipo de movimiento</h6>
                        <div class="rv-movement-type-toggle" role="group" aria-label="Tipo de movimiento">
                            <label class="rv-movement-type-option">
                                <input type="radio" name="movement_type" value="S" checked>
                                <span class="rv-movement-type-card rv-movement-type-out">
                                    <i class="fas fa-arrow-up"></i>
                                    <strong>Salida / Gasto</strong>
                                    <small>Resta del saldo de caja</small>
                                </span>
                            </label>
                            <label class="rv-movement-type-option">
                                <input type="radio" name="movement_type" value="E">
                                <span class="rv-movement-type-card rv-movement-type-in">
                                    <i class="fas fa-arrow-down"></i>
                                    <strong>Entrada / Ingreso</strong>
                                    <small>Suma al saldo de caja</small>
                                </span>
                            </label>
                        </div>
                    </section>

                    <section class="rv-expense-modal-section">
                        <h6 class="rv-expense-modal-section-title">Datos del movimiento</h6>
                        <div class="rv-form-grid">
                            <div class="rv-form-group rv-form-group-required">
                                <label for="id_expense_cash">Caja</label>
                                <select class="rv-form-control" id="id_expense_cash" name="cash" required>
                                    {% for c in cash_set %}
                                        <option value="{{ c.id }}" {% if cash_obj and cash_obj.id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="rv-form-group rv-form-group-required">
                                <label for="operation-date">Fecha</label>
                                <input type="date" class="rv-form-control" id="operation-date" name="operation_date"
                                       value="{{ formatdate }}" required>
                            </div>
                            <div class="rv-form-group rv-form-group-required rv-form-group-full">
                                <label for="id_user">Registrado por</label>
                                <select class="rv-form-control" id="id_user" name="user" required>
                                    {% for us in user_subsidiary_set %}
                                        <option value="{{ us.user.id }}" {% if us.user.id == request.user.id %}selected{% endif %}>{{ us.user.username|upper }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="rv-form-group rv-form-group-required rv-form-group-full">
                                <label for="id-description">Concepto</label>
                                <input type="text" class="rv-form-control text-uppercase" id="id-description"
                                       name="description" maxlength="100"
                                       placeholder="Ej. Comisión, combustible, peaje..." required>
                            </div>
                        </div>
                    </section>

                    <section class="rv-expense-modal-section">
                        <h6 class="rv-expense-modal-section-title">Tipo de pago</h6>
                        <div class="rv-expense-payment-options" role="group" aria-label="Tipo de pago">
                            <label class="rv-expense-payment-option">
                                <input type="radio" name="payment_method" value="E" checked required>
                                <span class="rv-expense-payment-card rv-payment-e">
                                    <i class="fas fa-money-bill-wave"></i>
                                    <strong>Efectivo</strong>
                                </span>
                            </label>
                            <label class="rv-expense-payment-option">
                                <input type="radio" name="payment_method" value="T">
                                <span class="rv-expense-payment-card rv-payment-t">
                                    <i class="fas fa-credit-card"></i>
                                    <strong>Tarjeta</strong>
                                </span>
                            </label>
                            <label class="rv-expense-payment-option">
                                <input type="radio" name="payment_method" value="Y">
                                <span class="rv-expense-payment-card rv-payment-y">
                                    <i class="fas fa-mobile-alt"></i>
                                    <strong>Yape</strong>
                                </span>
                            </label>
                            <label class="rv-expense-payment-option">
                                <input type="radio" name="payment_method" value="R">
                                <span class="rv-expense-payment-card rv-payment-r">
                                    <i class="fas fa-university"></i>
                                    <strong>Transferencia</strong>
                                </span>
                            </label>
                        </div>
                    </section>

                    <section class="rv-expense-modal-amount-panel" id="movement-amount-panel">
                        <label for="id-total" class="rv-expense-amount-label" id="movement-amount-label">Monto del movimiento</label>
                        <div class="rv-expense-amount-field">
                            <span class="rv-expense-currency">S/</span>
                            <input type="number" step="0.01" min="0.01" class="rv-expense-total-input" id="id-total"
                                   name="total" placeholder="0.00" required autofocus>
                        </div>
                        <p class="rv-expense-amount-hint mb-0" id="movement-amount-hint">
                            Se registrará como salida y restará del saldo de caja.
                        </p>
                    </section>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="rv-btn rv-btn-outline" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="rv-btn rv-btn-success" id="btn-expense-save">
                    <i class="fas fa-save"></i> <span id="movement-save-label">Registrar movimiento</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    (function () {
        function syncMovementTypeUI() {
            var type = $('input[name="movement_type"]:checked').val() || 'S';
            var isIncome = type === 'E';
            var $panel = $('#movement-amount-panel');
            var $icon = $('#movement-modal-icon');

            $panel.toggleClass('is-income', isIncome).toggleClass('is-expense', !isIncome);
            $icon.toggleClass('is-income', isIncome).toggleClass('is-expense', !isIncome);

            $('#movement-modal-title').text(isIncome ? 'Registrar entrada' : 'Registrar salida');
            $('#movement-amount-label').text(isIncome ? 'Monto del ingreso' : 'Monto del gasto');
            $('#movement-amount-hint').text(
                isIncome
                    ? 'Se registrará como entrada y sumará al saldo de caja.'
                    : 'Se registrará como salida y restará del saldo de caja.'
            );
            $('#movement-save-label').text(isIncome ? 'Registrar entrada' : 'Registrar salida');
            $('#id-description').attr(
                'placeholder',
                isIncome ? 'Ej. Comisión, reembolso, ingreso varios...' : 'Ej. Combustible, peaje, útiles...'
            );
            $icon.find('i').attr('class', isIncome ? 'fas fa-arrow-down' : 'fas fa-arrow-up');
        }

        $(document).off('change.movementType', 'input[name="movement_type"]')
            .on('change.movementType', 'input[name="movement_type"]', syncMovementTypeUI);
        syncMovementTypeUI();

        $('#new-expense-form').off('submit').on('submit', function (e) {
            e.preventDefault();
            var data = new FormData(this);
            var type = $('input[name="movement_type"]:checked').val() || 'S';
            $('#btn-expense-save').prop('disabled', true);
            $.ajax({
                url: '{% url "accounting:new_expense" %}',
                type: 'POST',
                data: data,
                cache: false,
                processData: false,
                contentType: false,
                success: function (response) {
                    $('#btn-expense-save').prop('disabled', false);
                    $('#modal-expense').modal('hide');
                    if (typeof reloadCashGrid === 'function') {
                        reloadCashGrid(response);
                    } else if (response.grid) {
                        $('#account-grid-list').html(response.grid);
                    }
                    if ($('#search-form').length) {
                        $('#search-form').trigger('submit');
                    }
                    toastr.success(response.message);
                },
                error: function (jqXhr) {
                    $('#btn-expense-save').prop('disabled', false);
                    toastr.error(jqXhr.responseJSON?.error || (type === 'E'
                        ? 'Error al registrar la entrada'
                        : 'Error al registrar la salida'));
                }
            });
        });
    })();
</script>
